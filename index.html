<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnonChat - Random Stranger Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        .container { 
            background: rgba(255, 255, 255, 0.95); 
            width: 100%; 
            max-width: 450px; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
            text-align: center; 
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #4a3fef;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .logo span { background: #4a3fef; color: white; padding: 2px 10px; border-radius: 8px; font-size: 14px; }
        .tagline { color: #666; font-size: 14px; margin-bottom: 25px; }

        /* Setup Screen */
        .gender-options {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }
        .gender-card {
            flex: 1;
            border: 2px solid #ddd;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fff;
        }
        .gender-card input { display: none; }
        .gender-card:hover, .gender-card.active {
            border-color: #4a3fef;
            background: #f0f3ff;
            transform: translateY(-2px);
        }
        .gender-card .icon { font-size: 30px; margin-bottom: 5px; }
        .gender-card .label { font-weight: 600; color: #333; }

        .btn {
            background: #4a3fef;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn:hover { background: #3b31cc; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }

        /* Chat Screen */
        #chat-screen { display: none; text-align: left; }
        #status { 
            font-size: 14px; 
            font-weight: 600; 
            color: #555; 
            background: #eef2f7; 
            padding: 10px; 
            border-radius: 8px; 
            text-align: center; 
            margin-bottom: 15px; 
        }
        #chat-box { 
            width: 100%; 
            height: 280px; 
            border: 1px solid #e1e8ed; 
            margin-bottom: 15px; 
            padding: 12px; 
            overflow-y: auto; 
            border-radius: 8px; 
            background: #fafbfc; 
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message { padding: 8px 12px; border-radius: 8px; max-width: 80%; font-size: 14px; word-break: break-word; }
        .message.stranger { background: #e2e8f0; color: #333; align-self: flex-start; }
        .message.self { background: #4a3fef; color: white; align-self: flex-end; }
        .message.system { background: #ffeeba; color: #856404; align-self: center; font-style: italic; font-size: 12px; }

        .chat-controls { display: flex; gap: 10px; }
        input[type="text"] { 
            flex: 1; 
            padding: 10px 14px; 
            font-size: 15px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            outline: none; 
        }
        input[type="text"]:focus { border-color: #4a3fef; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">💬 AnonChat <span>Live</span></div>
        <div class="tagline">Connect and chat with random people anonymously</div>

        <!-- 1. Gender Selection Screen -->
        <div id="setup-screen">
            <p style="margin-bottom: 10px; font-weight: 600; color: #444;">Select your gender to start:</p>
            <div class="gender-options">
                <label class="gender-card active" id="card-male">
                    <input type="radio" name="gender" value="Male" checked>
                    <div class="icon">👨</div>
                    <div class="label">Male</div>
                </label>
                <label class="gender-card" id="card-female">
                    <input type="radio" name="gender" value="Female">
                    <div class="icon">👩</div>
                    <div class="label">Female</div>
                </label>
            </div>
            <button id="start-btn" class="btn">Start Chatting</button>
        </div>

        <!-- 2. Chat Screen -->
        <div id="chat-screen">
            <div id="status">Connecting to server...</div>
            
            <div id="chat-box" style="display:none;"></div>
            
            <div class="chat-controls">
                <input type="text" id="message-input" placeholder="Type a message..." style="display:none;" />
                <button id="send-btn" class="btn" style="display:none; width: 80px;">Send</button>
            </div>

            <button id="find-btn" class="btn" style="margin-top: 10px; display: none;">Find New Partner</button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io();

        const setupScreen = document.getElementById('setup-screen');
        const chatScreen = document.getElementById('chat-screen');
        const startBtn = document.getElementById('start-btn');
        const findBtn = document.getElementById('find-btn');
        const statusDiv = document.getElementById('status');
        const chatBox = document.getElementById('chat-box');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');

        let currentRoom = null;

        // Interactive Gender Card Highlighting
        document.querySelectorAll('.gender-card').forEach(card => {
            card.addEventListener('click', () => {
                document.querySelectorAll('.gender-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                card.querySelector('input').checked = true;
            });
        });

        startBtn.addEventListener('click', () => {
            const selectedGender = document.querySelector('input[name="gender"]:checked').value;
            socket.emit('set-gender', selectedGender);

            setupScreen.style.display = 'none';
            chatScreen.style.display = 'block';
            
            // Automatically start searching for partner right after setup
            startSearching();
        });

        findBtn.addEventListener('click', () => {
            if (currentRoom) {
                socket.emit('leave-room', currentRoom);
                currentRoom = null;
            }
            startSearching();
        });

        function startSearching() {
            statusDiv.innerText = "Searching for a stranger...";
            findBtn.style.display = 'none';
            chatBox.style.display = 'none';
            messageInput.style.display = 'none';
            sendBtn.style.display = 'none';
            chatBox.innerHTML = '';
            socket.emit('find-partner');
        }

        socket.on('waiting', (msg) => {
            statusDiv.innerText = msg;
        });

        socket.on('matched', (room) => {
            currentRoom = room;
            statusDiv.innerText = "Partner found! Say hello 👋";
            chatBox.style.display = 'flex';
            messageInput.style.display = 'inline-block';
            sendBtn.style.display = 'inline-block';
            findBtn.style.display = 'block';
            appendSystemMessage("You are now chatting with a random stranger.");
        });

        socket.on('message', (msg) => {
            appendMessage(msg, 'stranger');
        });

        socket.on('partner-disconnected', () => {
            appendSystemMessage("Stranger has disconnected.");
            statusDiv.innerText = "Partner disconnected.";
            messageInput.style.display = 'none';
            sendBtn.style.display = 'none';
            currentRoom = null;
            findBtn.style.display = 'block';
            findBtn.innerText = "Find New Partner";
        });

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        function sendMessage() {
            const msg = messageInput.value.trim();
            if (msg && currentRoom) {
                appendMessage(msg, 'self');
                socket.emit('message', { room: currentRoom, message: msg });
                messageInput.value = '';
            }
        }

        function appendMessage(text, sender) {
            const div = document.createElement('div');
            div.classList.add('message', sender);
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendSystemMessage(text) {
            const div = document.createElement('div');
            div.classList.add('message', 'system');
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
